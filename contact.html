<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا | رفيق الطالب</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header>
        <div class="logo">🎓 رفيق الطالب</div>
        <nav>
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="courses.html">المقررات</a></li>
                <li><a href="assignments.html">التكليفات</a></li>
                <li><a href="library.html">المكتبة</a></li>
                <li><a href="contact.html" class="active">تواصل معنا</a></li>
            </ul>
        </nav>
        <div class="buttons">
            <a href="login.html" class="login-btn">تسجيل الدخول</a>
            <a href="register.html" class="register-btn">إنشاء حساب</a>
        </div>
    </header>

    <section class="page-banner">
        <div class="container">
            <h1>📞 تواصل معنا</h1>
            <p>إذا كان لديك أي استفسار أو اقتراح، يمكنك التواصل معنا.</p>
        </div>
    </section>

    <section class="contact-section">
        <div class="container">
            <div class="form-wrapper">
                <form class="custom-form">
                    <div class="form-group">
                        <label for="name">الاسم</label>
                        <input type="text" id="name" placeholder="اكتب اسمك" required>
                    </div>
                    <div class="form-group">
                        <label for="email">البريد الإلكتروني</label>
                        <input type="email" id="email" placeholder="example@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label for="message">الرسالة</label>
                        <textarea id="message" rows="5" placeholder="اكتب رسالتك" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-main full-width">إرسال</button>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <p>جميع الحقوق محفوظة © 2026 | رفيق الطالب</p>
    </footer>

</body>
</html>
