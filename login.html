<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | رفيق الطالب</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body class="auth-body">

    <div class="auth-card">
        <div class="logo">🎓 رفيق الطالب</div>
        <h2>تسجيل الدخول</h2>
        <p class="auth-subtitle">أدخل بياناتك للوصول إلى حسابك</p>

        <form class="custom-form">
            <div class="form-group">
                <label for="login-email">البريد الإلكتروني</label>
                <input type="email" id="login-email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="login-password">كلمة المرور</label>
                <input type="password" id="login-password" placeholder="كلمة المرور" required>
            </div>

            <button type="submit" class="btn btn-main full-width">تسجيل الدخول</button>
        </form>

        <p class="auth-footer">
            ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a>
        </p>
        <div class="back-home">
            <a href="index.html">العودة للرئيسية</a>
        </div>
    </div>

</body>
</html>
