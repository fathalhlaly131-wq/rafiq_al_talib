<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد | رفيق الطالب</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body class="auth-body">

    <div class="auth-card">
        <div class="logo">🎓 رفيق الطالب</div>
        <h2>إنشاء حساب جديد</h2>
        <p class="auth-subtitle">أنشئ حسابك للوصول إلى كافة خدمات المنصة</p>

        <form class="custom-form">
            <div class="form-group">
                <label for="reg-name">الاسم الكامل</label>
                <input type="text" id="reg-name" placeholder="أدخل اسمك الكامل" required>
            </div>

            <div class="form-group">
                <label for="reg-email">البريد الإلكتروني</label>
                <input type="email" id="reg-email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="reg-password">كلمة المرور</label>
                <input type="password" id="reg-password" placeholder="أدخل كلمة المرور" required>
            </div>

            <div class="form-group">
                <label for="reg-confirm">تأكيد كلمة المرور</label>
                <input type="password" id="reg-confirm" placeholder="أعد أدخل كلمة المرور" required>
            </div>

            <button type="submit" class="btn btn-main full-width">إنشاء الحساب</button>
        </form>

        <p class="auth-footer">
            لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
        </p>
        <div class="back-home">
            <a href="index.html">العودة للرئيسية</a>
        </div>
    </div>

</body>
</html>
